[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tl-delay-collector"
version = "1.0.0"
description = "Collecte des retards des bus/métro des TL (Transports publics de la région lausannoise) via opentransportdata.swiss (GTFS statique + GTFS-RT)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
tl-delay-collector = "tl_delay_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
